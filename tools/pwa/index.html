<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Era Calendar</title>
    
    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Navigation Bar -->
      <nav style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-surface, #121826);">
        <button id="nav-tools" style="background: none; border: none; cursor: pointer; font-weight: bold; color: inherit;">Tools</button>
        <button id="nav-docs" style="background: none; border: none; cursor: pointer; font-weight: bold; color: inherit;">Docs</button>
      </nav>

      <!-- Main Views -->
      <main style="padding: 1rem;">
        <section id="view-tools"></section>
        <section id="view-docs" style="display: none;"></section>
      </main>

      <!-- Footer Container -->
      <footer id="footer-container"></footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
